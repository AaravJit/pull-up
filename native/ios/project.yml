# XcodeGen spec. The .xcodeproj is generated (CI runs `xcodegen generate`)
# and gitignored, so project changes are reviewed here as plain YAML.
name: PullUp
options:
  bundleIdPrefix: app.pullup
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(PULLUP_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  PullUpKit:
    path: Packages/PullUpKit
targets:
  PullUp:
    type: application
    platform: iOS
    sources:
      - path: PullUp
        excludes:
          - "*.entitlements"
    dependencies:
      - package: PullUpKit
        product: PullUpFeatures
      - package: PullUpKit
        product: PullUpDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULLUP_BUNDLE_ID)
        PRODUCT_NAME: PullUp
        INFOPLIST_FILE: PullUp/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(PULLUP_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  # App-hosted, so StoreKit Testing (SKTestSession) can drive the app's
  # StoreKit client with the local configuration file.
  PullUpStoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PullUpStoreTests
        excludes:
          - "*.storekit"
      - path: PullUpStoreTests/PullUpPro.storekit
        buildPhase: resources
    dependencies:
      - target: PullUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULLUP_BUNDLE_ID).storetests
        GENERATE_INFOPLIST_FILE: YES
  PullUpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PullUpUITests
    dependencies:
      - target: PullUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PULLUP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PullUp
schemes:
  PullUp:
    build:
      targets:
        PullUp: all
        PullUpUITests: [test]
        PullUpStoreTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-PullUpDemo": false
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: PullUpStoreTests
        - name: PullUpUITests
    archive:
      config: Release
