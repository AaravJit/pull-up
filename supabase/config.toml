# Local development configuration for the Supabase CLI. Production settings
# (Apple sign-in keys, SMTP, URL allow-list) are configured in the Supabase
# dashboard; see docs/RELEASE_CHECKLIST.md.
project_id = "pull-up"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "pullup://auth-callback"
additional_redirect_urls = ["pullup://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Lets a signed-in user add a second sign-in method (Google on Android).
# Pull Up refuses links the user didn't start: see migration
# 20261017000100_accounts.sql.
enable_manual_linking = true

# New accounts are created with Sign in with Apple (Google on Android later).
# Email stays enabled for sign-in: the App Review demo account is made in the
# dashboard, and CI's API tests sign in synthetic users with it. Despite its
# name, `enable_signup` here switches the whole email provider on or off;
# the app itself offers no email sign-up.
[auth.email]
enable_signup = true
enable_confirmations = true

# Refuses new email (and phone) accounts from the public sign-up endpoint;
# admin-created accounts are unaffected. Migration 20261018000100.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

# Enabled in production once the Services ID and signing key exist.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[storage]
enabled = true
file_size_limit = "100MiB"

[edge_runtime]
enabled = true
policy = "oneshot"

# Apple calls this without a Supabase token; it checks every claim against
# the App Store Server API instead (functions/app-store-notifications).
[functions.app-store-notifications]
verify_jwt = false
