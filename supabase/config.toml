# Local development configuration for the Supabase CLI. Production settings
# (Apple sign-in keys, SMTP, URL allow-list) are configured in the Supabase
# dashboard; see docs/RELEASE_CHECKLIST.md.
project_id = "pull-up"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "pullup://auth-callback"
additional_redirect_urls = ["pullup://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Enabled in production once the Services ID and signing key exist.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[storage]
enabled = true
file_size_limit = "100MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
