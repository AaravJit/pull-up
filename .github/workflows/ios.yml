name: iOS

on:
  push:
    branches: [main, "claude/**"]
    paths: ["native/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["native/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: PullUpKit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('native/ios/Packages/PullUpKit/Package.resolved', 'native/ios/Packages/PullUpKit/Package.swift') }}
      - name: Test package on simulator
        working-directory: native/ios/Packages/PullUpKit
        run: |
          SIM=$(../../scripts/simulator-id.sh)
          ../../scripts/xcodebuild-ci.sh test \
            -scheme PullUpKit-Package \
            -destination "id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/PullUpKit.xcresult" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PullUpKit-xcresult
          path: ${{ runner.temp }}/PullUpKit.xcresult
          if-no-files-found: ignore

  app:
    name: App build, UI tests, screenshots
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # pushes screenshots to the ci/screenshots branch
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('native/ios/Packages/PullUpKit/Package.swift', 'native/ios/project.yml') }}
      - name: Generate project
        working-directory: native/ios
        run: xcodegen generate
      - name: Build and run UI tests
        working-directory: native/ios
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR"
          SIM=$(./scripts/simulator-id.sh)
          xcrun simctl boot "$SIM" || true
          # Fixed status bar so screenshots are comparable run to run.
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          ./scripts/xcodebuild-ci.sh test \
            -project PullUp.xcodeproj \
            -scheme PullUp \
            -destination "id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/PullUp.xcresult" \
            -skip-testing:PullUpStoreTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: StoreKit tests
        # `xcodebuild test` from the command line doesn't hand the StoreKit
        # configuration to the simulator's storekitd on iOS 26.4 and 26.5, so
        # SKTestSession silently falls through to the real App Store and finds
        # no products (Apple FB22237318, no workaround; signing doesn't help).
        # iOS 26.2 is unaffected, so these tests run there. Move them back to
        # the main run once Apple ships a fix.
        if: always()
        working-directory: native/ios
        run: |
          SIM=$(IOS_BELOW=26.4 ./scripts/simulator-id.sh)
          ./scripts/xcodebuild-ci.sh test \
            -project PullUp.xcodeproj \
            -scheme PullUp \
            -destination "id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/PullUpStore.xcresult" \
            -only-testing:PullUpStoreTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PullUp-xcresult
          path: |
            ${{ runner.temp }}/PullUp.xcresult
            ${{ runner.temp }}/PullUpStore.xcresult
          if-no-files-found: ignore
      - name: Publish screenshots to ci/screenshots branch
        # Lets reviewers (and the agent building this app without a Mac) look
        # at real simulator renders without downloading artifacts.
        if: always() && github.event_name != 'pull_request'
        env:
          SHOTS: ${{ runner.temp }}/screenshots
        run: |
          [ -n "$(ls -A "$SHOTS" 2>/dev/null)" ] || { echo "No screenshots"; exit 0; }
          BRANCH="ci/screenshots"
          DIR="${GITHUB_REF_NAME//\//-}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK="$RUNNER_TEMP/shots-repo"
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$WORK" 2>/dev/null || {
            git init "$WORK"; cd "$WORK"; git checkout --orphan "$BRANCH"
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; cd -; }
          rm -rf "$WORK/$DIR"; mkdir -p "$WORK/$DIR"
          cp "$SHOTS"/*.png "$WORK/$DIR/"
          echo "${GITHUB_SHA}" > "$WORK/$DIR/COMMIT"
          cd "$WORK"
          git add -A
          git commit -m "Screenshots for ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" || exit 0
          git push origin "HEAD:$BRANCH"
