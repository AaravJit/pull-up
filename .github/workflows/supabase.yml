name: Backend

on:
  push:
    branches: [main, "claude/**"]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Migrations, rollbacks and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, same as supabase-deploy.yml: resolving "latest" calls the
          # GitHub API, whose unauthenticated rate limit fails this step.
          version: 2.121.0
      - name: Destructive-migration gate tests
        run: python3 -m unittest discover -s supabase/scripts -p 'test_*.py'
      - name: Migrations already on staging are unchanged
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          bash supabase/scripts/check-applied-migrations.sh
      - name: Start local Supabase (applies every migration)
        run: supabase db start
      - name: Row-level security and validation tests (pgTAP)
        run: supabase test db
      - name: Lint schema
        run: supabase db lint --level warning --fail-on error
      - name: Rollbacks apply cleanly in reverse order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in $(ls supabase/rollback/*.sql | sort -r); do
            echo "Applying $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "Re-applying migrations after rollback"
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Edge function type-check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Edge function unit tests (stubbed Apple, no network)
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/

  api:
    name: Two-account API tests (full local stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, same as supabase-deploy.yml: resolving "latest" calls the
          # GitHub API, whose unauthenticated rate limit fails this step.
          version: 2.121.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Start local Supabase (Auth, REST, Storage, Realtime, Edge Functions)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta
      - name: Synthetic accounts exercise every app API
        run: |
          eval "$(supabase status -o env)"
          PULLUP_API_TARGET=local PULLUP_API_URL="$API_URL" PULLUP_API_ANON_KEY="$ANON_KEY" \
          PULLUP_API_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/tests/api/
      - name: Edge function logs
        if: failure()
        run: docker logs "$(docker ps -qf name=supabase_edge_runtime)" 2>&1 | tail -200
