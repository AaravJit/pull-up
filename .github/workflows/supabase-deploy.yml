name: Supabase deploy

# Applies supabase/migrations and the edge functions to a hosted project.
# Run by hand from the Actions tab; nothing deploys on push. Each run uses a
# GitHub environment ("staging" or "production") that holds that project's
# settings, so the two can't be mixed up. Give "production" required
# reviewers so every production run waits for a person's approval.
#
# Environment settings (docs/SUPABASE_SETUP.md):
#   variable SUPABASE_PROJECT_REF   the project's ref
#   secret   SUPABASE_ACCESS_TOKEN  a personal access token of the project owner
#   secret   SUPABASE_DB_PASSWORD   the project's database password
#   optional secrets for the functions: PUSH_WEBHOOK_SECRET, CRON_SECRET,
#   APNS_*, APPLE_*, APPSTORE_*, MODERATION_WEBHOOK_URL,
#   MODERATION_WEBHOOK_SECRET (copied to the project only when present)
#
# Staging runs also run the pgTAP suite and the two-account API tests
# against the project. Production never runs tests that write data.
#
# Database commands connect through the project's shared pooler (Supavisor)
# in session mode, which is reachable over IPv4. GitHub-hosted runners have
# no IPv6, and the direct host db.<ref>.supabase.co is IPv6-only unless the
# paid IPv4 add-on is on.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which project
        type: choice
        options: [staging, production]
        default: staging
      apply:
        description: Apply the changes (unticked = dry run that only lists them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.apply && 'Deploy to' || 'Dry run for' }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned so a CLI release can't change how this job connects.
          version: 2.121.0

      - name: Check the environment is configured
        run: |
          missing=""
          [ -n "$PROJECT_REF" ] || missing="$missing variable SUPABASE_PROJECT_REF,"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret SUPABASE_ACCESS_TOKEN,"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing secret SUPABASE_DB_PASSWORD,"
          if [ -n "$missing" ]; then
            echo "::error::The ${{ inputs.environment }} environment is missing:${missing%,}. See docs/SUPABASE_SETUP.md."
            exit 1
          fi

      # Read-only, and it never fails the run: shows whether the sign-in
      # settings the app needs are on, so they can be checked without
      # opening the dashboard. Only named non-secret fields are printed
      # (the config also holds provider secrets and SMTP passwords).
      - name: Report the sign-in settings
        run: |
          set -o pipefail
          if ! config=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"); then
            echo "::warning::Couldn't read the auth settings with SUPABASE_ACCESS_TOKEN."
            exit 0
          fi
          bundle=$(grep -E '^PULLUP_BUNDLE_ID *=' native/ios/Config/Base.xcconfig | sed -E 's/.*= *//')
          jq -r --arg bundle "$bundle" '
            def show($k): "\($k): \(if has($k) then .[$k] else "(not reported)" end)";
            def ids: (.external_apple_client_id // "") | split(",") | map(gsub("^ +| +$"; ""));
            show("external_apple_enabled"),
            "external_apple_client_id includes \($bundle): \(ids | index($bundle) != null)",
            show("hook_before_user_created_enabled"),
            show("hook_before_user_created_uri"),
            "uri_allow_list includes pullup://auth-callback: \((.uri_allow_list // "") | split(",") | map(gsub("^ +| +$"; "")) | index("pullup://auth-callback") != null)",
            show("disable_signup"), show("external_email_enabled"), show("external_phone_enabled"),
            show("external_anonymous_users_enabled")
          ' <<<"$config" | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::Couldn't parse the auth settings."

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # The connection string comes from the Management API, the same source
      # `supabase link` uses, and is checked before use: the host must be a
      # supabase.com pooler and the user must name this project. TLS is
      # required for migration list and db push (no fallback to an
      # unencrypted connection). `supabase test db` passes pg_prove only the
      # host, user and password, so the pgTAP run uses libpq's default
      # (sslmode=prefer: TLS when the server offers it, as the pooler does).
      # The URL holds the password, so it is masked and kept in a file only
      # this job can read.
      - name: Resolve the IPv4 session pooler
        run: |
          set -o pipefail
          umask 077
          configs=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler")
          primary=$(jq -c 'first(.[] | select(.database_type == "PRIMARY")) // empty' <<<"$configs")
          if [ -z "$primary" ]; then
            echo "::error::The project reports no primary pooler, so there is no IPv4 route to its database."
            exit 1
          fi
          mode=$(jq -r '.pool_mode' <<<"$primary")
          url=$(jq -r '.connection_string' <<<"$primary")
          url=${url//:\[YOUR-PASSWORD\]/}
          # Session mode is on 5432; transaction mode (6543) can't run migrations.
          [ "$mode" = "session" ] || url=${url//:6543\//:5432\/}
          rest=${url#postgresql://}; [ "$rest" != "$url" ] || rest=${url#postgres://}
          user=${rest%%@*}
          hostport=${rest#*@}; hostport=${hostport%%/*}
          host=${hostport%:*}
          case "$host" in
            *.pooler.supabase.com) ;;
            *) echo "::error::Unexpected pooler host '$host'."; exit 1 ;;
          esac
          [ "$user" = "postgres.$PROJECT_REF" ] || { echo "::error::Pooler user '$user' doesn't belong to this project."; exit 1; }
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$password"
          case "$rest" in *\?*) sep='&' ;; *) sep='?' ;; esac
          db_url="postgresql://$user:$password@${rest#*@}${sep}sslmode=require"
          echo "::add-mask::$db_url"
          printf '%s' "$db_url" > "$RUNNER_TEMP/db-url"
          echo "Using the session pooler at $hostport ($mode mode reported) with TLS required."

      # db push refuses to run when the project has migrations this checkout
      # lacks (for example ones deployed to staging from a pull request that
      # isn't merged yet). Name them instead of failing on the CLI's error.
      - name: The checkout has every migration the project has applied
        run: |
          set -o pipefail
          # --agent no keeps the text table this step parses, whatever the
          # runner's environment looks like. CLI 2.121 wraps each cell in
          # backticks; the awk below strips them along with the padding.
          supabase migration list --agent no --db-url "$(cat "$RUNNER_TEMP/db-url")" | tee "$RUNNER_TEMP/migrations.txt"
          missing=$(awk -F'|' '{ l=$1; r=$2; gsub(/[ `]/, "", l); gsub(/[ `]/, "", r) } l == "" && r ~ /^[0-9]+$/ && length(r) == 14 { print r }' "$RUNNER_TEMP/migrations.txt")
          if [ -n "$missing" ]; then
            echo "::error::${{ inputs.environment }} has migrations this checkout doesn't: $(echo $missing | tr '\n' ' '). Merge the pull requests that add them, then run from main."
            exit 1
          fi

      - name: List migrations the project doesn't have yet
        id: pending
        run: |
          set -o pipefail
          supabase db push --dry-run --agent no --db-url "$(cat "$RUNNER_TEMP/db-url")" 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          pending=$({ grep -oE '[0-9]{14}_[a-z0-9_]+\.sql' "$RUNNER_TEMP/dry-run.txt" || true; } | sort -u | sed 's|^|supabase/migrations/|' | tr '\n' ' ')
          echo "files=$pending" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.environment }}: pending migrations"
            if [ -n "$pending" ]; then for f in $pending; do echo "- \`$f\`"; done; else echo "None"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every migration is recorded in the staging manifest
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          bash supabase/scripts/check-applied-migrations.sh --complete

      - name: Refuse migrations that could destroy data
        if: steps.pending.outputs.files != ''
        run: supabase/scripts/check-pending-migrations.sh ${{ steps.pending.outputs.files }}

      - name: Apply migrations
        if: inputs.apply
        run: supabase db push --db-url "$(cat "$RUNNER_TEMP/db-url")"

      - name: Copy function secrets from this environment
        if: inputs.apply
        env:
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_BUNDLE_ID: ${{ secrets.APPSTORE_BUNDLE_ID }}
          MODERATION_WEBHOOK_URL: ${{ secrets.MODERATION_WEBHOOK_URL }}
          MODERATION_WEBHOOK_SECRET: ${{ secrets.MODERATION_WEBHOOK_SECRET }}
          PULLUP_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          umask 077
          file="$RUNNER_TEMP/function-secrets.env"
          : > "$file"
          names=""
          absent=""
          for name in PUSH_WEBHOOK_SECRET CRON_SECRET APNS_KEY_ID APNS_PRIVATE_KEY APNS_TEAM_ID APNS_TOPIC \
                      APPLE_CLIENT_ID APPLE_KEY_ID APPLE_PRIVATE_KEY APPLE_TEAM_ID \
                      APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY APPSTORE_BUNDLE_ID \
                      MODERATION_WEBHOOK_URL MODERATION_WEBHOOK_SECRET PULLUP_ENVIRONMENT_NAME; do
            value="${!name}"
            if [ -z "$value" ]; then absent="$absent $name"; continue; fi
            printf '%s="%s"\n' "$name" "$value" >> "$file"
            names="$names $name"
          done
          # This environment is the source of truth: a secret deleted here
          # (say, a revoked key) is removed from the project too.
          existing=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" | jq -r '.[].name')
          stale=""
          for name in $absent; do
            grep -qx "$name" <<<"$existing" && stale="$stale $name"
          done
          if [ -n "$stale" ]; then
            supabase secrets unset --project-ref "$PROJECT_REF" $stale
            echo "Removed (no longer in this environment):$stale"
          fi
          if [ -n "$names" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "$file"
            echo "Set:$names"
          else
            echo "No function secrets in this environment; functions that need them answer \"not configured\"."
          fi
          rm -f "$file"

      - name: Deploy edge functions
        if: inputs.apply
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Database tests (pgTAP, rolled back) on staging
        if: inputs.apply && inputs.environment == 'staging'
        run: supabase test db --db-url "$(cat "$RUNNER_TEMP/db-url")"

      - uses: denoland/setup-deno@v2
        if: inputs.apply && inputs.environment == 'staging'
        with:
          deno-version: v2.x

      - name: Two-account API tests on staging
        if: inputs.apply && inputs.environment == 'staging'
        run: |
          # Legacy anon/service_role keys if the project has them, else the
          # newer publishable/secret keys. Straight from the Management API:
          # the CLI this job installs has no way to reveal secret keys.
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true")
          service=$(jq -r 'first(.[] | select(.name == "service_role" or .type == "secret") | .api_key) // empty' <<<"$keys")
          [ -n "$service" ] && echo "::add-mask::$service"
          anon=$(jq -r 'first(.[] | select(.name == "anon" or .type == "publishable") | .api_key) // empty' <<<"$keys")
          if [ -z "$anon" ] || [ -z "$service" ]; then
            echo "::error::Couldn't read the project's API keys with SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          PULLUP_API_TARGET=staging PULLUP_API_URL="https://$PROJECT_REF.supabase.co" \
          PULLUP_API_ANON_KEY="$anon" PULLUP_API_SERVICE_ROLE_KEY="$service" \
            deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/tests/api/

      - name: Remove the connection string
        if: always()
        run: rm -f "$RUNNER_TEMP/db-url"
